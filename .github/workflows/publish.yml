name: Publish Shorts

on:
  schedule:
    - cron: "20 8 * * *"  # 08:20 UTC = 10:20 Beirut, just after the YouTube API daily quota resets (midnight Pacific).
                          # The watcher also dispatches this workflow after 08:15 UTC if GitHub's cron is late.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render only, don't upload"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Is YouTube connected?
        id: gate
        run: |
          if [ -f youtube_token.enc ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "YouTube not connected yet; skipping."; fi
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go == 'true'
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == 'true'
        with:
          python-version: "3.12"

      - name: Install
        if: steps.gate.outputs.go == 'true'
        run: |
          npm ci
          npx remotion browser ensure
          pip install google-api-python-client google-auth

      - name: Load YouTube token
        if: steps.gate.outputs.go == 'true'
        env:
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
        run: |
          if [ -f youtube_token.enc ] && [ -n "$YT_CLIENT_SECRET" ]; then
            T=$(openssl enc -d -aes-256-cbc -pbkdf2 -a -A -pass env:YT_CLIENT_SECRET -in youtube_token.enc)
            echo "::add-mask::$T"
            echo "YT_REFRESH_TOKEN=$T" >> "$GITHUB_ENV"
          fi

      - name: Render and schedule today's episodes
        if: steps.gate.outputs.go == 'true'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python scripts/publish.py

      - name: Keep rendered videos for review
        if: steps.gate.outputs.go == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: videos
          path: out/*.mp4
          retention-days: 7
          if-no-files-found: ignore

      - name: Save queue status
        if: always() && steps.gate.outputs.go == 'true'
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add episodes.json stats.json 2>/dev/null || git add episodes.json
          git diff --cached --quiet || git commit -m "Scheduled today's Shorts"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs -q && git push && exit 0
            echo "push rejected, retrying ($i)"; sleep $((i*5))
          done
          exit 1
