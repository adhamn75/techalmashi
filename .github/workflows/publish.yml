name: Publish Shorts

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC = 08:00 Beirut (winter). Videos are scheduled for the times in episodes.json.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render only, don't upload"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          npm ci
          npx remotion browser ensure
          pip install google-api-python-client google-auth

      - name: Load YouTube token
        env:
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
        run: |
          if [ -f youtube_token.enc ] && [ -n "$YT_CLIENT_SECRET" ]; then
            T=$(openssl enc -d -aes-256-cbc -pbkdf2 -a -A -pass env:YT_CLIENT_SECRET -in youtube_token.enc)
            echo "::add-mask::$T"
            echo "YT_REFRESH_TOKEN=$T" >> "$GITHUB_ENV"
          fi

      - name: Render and schedule today's episodes
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python scripts/publish.py

      - name: Keep rendered videos for review
        uses: actions/upload-artifact@v4
        with:
          name: videos
          path: out/*.mp4
          retention-days: 7
          if-no-files-found: ignore

      - name: Save queue status
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add episodes.json stats.json 2>/dev/null || git add episodes.json
          git diff --cached --quiet || git commit -m "Scheduled today's Shorts"
          git push
