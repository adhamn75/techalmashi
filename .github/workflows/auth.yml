name: auth (one-time YouTube connect)

on:
  workflow_dispatch:
    inputs:
      code:
        description: "The code from the Google sign-in redirect"
        required: true

jobs:
  exchange:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exchange code for refresh token
        env:
          AUTH_CODE: ${{ inputs.code }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
        run: python3 scripts/exchange_code.py
      - name: Encrypt token
        run: |
          openssl pkeyutl -encrypt -pubin -inkey auth_pubkey.pem \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \
            -in token.txt -out token.enc
          rm token.txt
      - uses: actions/upload-artifact@v4
        with:
          name: token
          path: token.enc
          retention-days: 1
