name: Connect YouTube (one time)

# Paste the whole "localhost/?code=..." address from the Google sign-in into the box.
# The resulting token is encrypted with the YT_CLIENT_SECRET secret and saved as
# youtube_token.enc, so it never appears in logs or in plain text in the repo.
on:
  workflow_dispatch:
    inputs:
      code:
        description: "Paste the localhost address you got after allowing access"
        required: true
      account:
        description: "Which channel you signed in as"
        type: choice
        options: [tech, horror]
        default: tech

permissions:
  contents: write

jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hide the code in logs
        run: echo "::add-mask::${{ inputs.code }}"
      - name: Exchange code and save encrypted token
        env:
          AUTH_CODE: ${{ inputs.code }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
        run: |
          F=youtube_token.enc; [ "${{ inputs.account }}" != "tech" ] && F="youtube_token_${{ inputs.account }}.enc"
          python3 scripts/exchange_code.py
          openssl enc -aes-256-cbc -pbkdf2 -a -A -salt -pass env:YT_CLIENT_SECRET -in token.txt -out "$F"
          rm token.txt
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add "$F"
          git commit -m "Connect YouTube: ${{ inputs.account }} (encrypted token)"
          git push
