name: Remove duplicate replies (one reply per person)

# Owner's rule: a person gets ONE reply per video. Deletes any extra reply our channel posted to the same
# person, keeping the first. Also runs about every hour inside the watcher. Deletes are capped by quota.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only list what it would delete"
        type: boolean
        default: false
  schedule:
    - cron: "41 */3 * * *"

permissions:
  contents: write

concurrency:
  group: auto-reply
  cancel-in-progress: false

jobs:
  dedupe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q google-api-python-client google-auth
      - name: Load YouTube token
        env:
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
        run: |
          T=$(openssl enc -d -aes-256-cbc -pbkdf2 -a -A -pass env:YT_CLIENT_SECRET -in youtube_token.enc)
          echo "::add-mask::$T"
          echo "YT_REFRESH_TOKEN=$T" >> "$GITHUB_ENV"
      - name: Delete duplicates
        env:
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python scripts/dedupe_replies.py
      - name: Save state
        if: always()
        run: |
          [ -f docs/dedupe_state.json ] || exit 0
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add docs/dedupe_state.json
          git diff --cached --quiet && exit 0
          git commit -q -m "Duplicate-reply cleanup state"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q && exit 0; sleep 5; done
