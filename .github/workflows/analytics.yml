name: Analytics (retention)

# Pulls per-video retention, average view % and subscribers gained with the SEPARATE read-only
# analytics token (youtube_analytics_<account>.enc). The publishing token is never used here.
# Before a channel is connected (see analytics/README.md) this workflow just skips it.
on:
  workflow_dispatch:
  schedule:
    - cron: "30 9 * * *"

permissions:
  contents: write

concurrency:
  group: analytics
  cancel-in-progress: false

jobs:
  retention:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q google-api-python-client google-auth
      - name: Fetch retention
        env:
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
        run: |
          cd scripts
          for acc in tech horror; do
            if [ -f "../youtube_analytics_${acc}.enc" ]; then
              python analytics.py "$acc" || echo "::warning::analytics for $acc failed"
            else
              echo "Analytics not connected for $acc yet (see analytics/README.md)"
            fi
          done
      - name: Save
        run: |
          ls analytics/retention*.json >/dev/null 2>&1 || { echo "no analytics reports yet"; exit 0; }
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add analytics/retention*.json
          git diff --cached --quiet && exit 0
          git commit -q -m "Analytics: retention"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q && exit 0; sleep 5; done
          exit 1
