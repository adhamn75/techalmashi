name: Voice-over (TTS)

on:
  workflow_dispatch:
  push:
    paths: ["voice/lines.json"]

permissions:
  contents: write

jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install edge-tts
      - run: python scripts/tts.py
      - name: Save voice files to the repo
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add voice
          git diff --cached --quiet || git commit -m "Voice-over files [skip ci]"
          git push
